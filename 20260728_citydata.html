<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>縣市資料應用</title>
    <link rel="stylesheet" href="css/basic_template.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        .card-img-top {
            height: 220px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div id="app" class="container my-4">
        <div class="display-2 text-center fw-bold text-bg-success py-3 rounded rounded-3">{{ title }}</div>

        <div class="row justify-content-center">
            <!-- 選單 -->
            <div class="col-md-6">
                <select name="" id="" class="form-select form-select-lg mt-3" v-model="selectedCity"
                    @change="getAreaList">
                    <option value="" disabled selected class="text-center">選擇縣市名稱</option>
                    <option :value="item.CityName" v-for="item in cityData">
                        {{ item.CityName }}
                    </option>
                </select>
                <select name="" id="" class="form-select form-select-lg mt-3" v-model="selectedArea"
                    @change="filterHotelData">
                    <option value="" disabled selected class="text-center">選擇鄉鎮區名稱</option>
                    <option :value="item.AreaName" v-for="item in areaList">
                        {{ item.AreaName}}
                    </option>
                </select>
            </div>

            <!-- 統計資訊 -->
            <div class="row" v-if="selectedCity && selectedArea && filterHotel.length > 0">
                <div class="col-12 mt-4">
                    <div class="alert alert-success">
                        搜尋地區：<span class="fw-bold">{{ selectedCity }}{{ selectedArea }}</span><br>
                        共找到 <span class="text-primary fw-bold">{{ filterHotel.length }}</span> 筆旅館資料
                    </div>
                </div>
            </div>
            <div class="row" v-else-if="selectedCity && selectedArea && filterHotel.length < 1">
                <div class="col-12 mt-4">
                    <div class="alert alert-warning">此地區沒有旅館資料</div>
                </div>
            </div>
            <div class="row" v-else="">
                <div class="col-12 mt-4">
                    <div class="alert alert-info text-center">尚未選取搜尋範圍</div>
                </div>
            </div>

            <!-- 頁碼 -->
            <div class="col" v-if="selectedCity && selectedArea && filterHotel.length > 0">
                <!-- <div class="col"> -->
                <div class="row col-2">
                    <label for="setPageSize">每頁顯示數量</label>
                    <select name="setPageSize" id="setPageSize" v-model="pageSize">
                        <option value="8">8</option>
                        <option value="12" selected>12</option>
                        <option value="16">16</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-12">
                        <nav aria-label="Page navigation example">
                            <ul class="pagination justify-content-center">
                                <!-- <li class="page-item"><a class="page-link" href="#" @click="previousPage(item)">Previous</a></li> -->
                                <li class="page-item"><a class="page-link" :class="{ disabled : currentPage == 1 }"
                                        href="#" @click="changePage(currentPage - 1)">Previous</a></li>
                                <li class="page-item" v-for="item in totalPage">
                                    <a class="page-link" :class="{ active : currentPage == item }" href="#"
                                        @click="changePage(item)">{{ item }}</a>
                                </li>
                                <!-- <li class="page-item"><a class="page-link" href="#" @click="nextPage(item)">Next</a></li> -->
                                <li class="page-item"><a class="page-link"
                                        :class="{ disabled : currentPage >= totalPage }" href="#"
                                        @click="changePage(currentPage + 1)">Next</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>

            <!-- 卡片列表 -->
            <div class="row">
                <div class="col-md-4 col-xl-3 mt-3" v-for="item in pageHotelData">
                    <!-- template -->
                    <!-- <div class="card h-100">
                        <img src="images/scott-webb-1ddol8rgUH8-unsplash.jpg" class="card-img-top" alt="">
                        <div class="card-body">
                            <h5 class="card-title">旅館名稱</h5>
                            <p class="card-text">地址：XX市XX區XX路XX號</p>
                            <p class="card-text">電話：(XX)-XXXX-XXXX</p>
                            <p class="card-text">簡介：背後難道已經宅宅印象病人加工不對打印出現早上分享，水果首先成立，沒事是指昨日，實際上彼此，緊急百姓。 ...</p>
                            <p href="#" class="btn btn-outline-primary w-100">查看</p>
                        </div>
                    </div> -->
                    <div class="card h-100">
                        <img :src="item.img" class="card-img-top" alt="">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">{{ item.name }}</h5>
                            <p class="card-text">地址：{{ item.city }}{{ item.town }}{{ item.street }}</p>
                            <p class="card-text">電話：{{ item.tel }}</p>
                            <p class="card-text">簡介：{{ item.description }} ...</p>
                            <p href="#" class="btn btn-outline-primary w-100">查看</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/vue.global.js"></script>
    <script src="js/cleanText.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script>
        const App = {
            data() {
                return {
                    title: "縣市資料應用",
                    cityData: [],
                    areaList: [],
                    HotelData: [],      // 過濾前的完整旅館資料
                    filterHotel: [],    // 依縣市過濾後的旅館資料
                    selectedCity: '',
                    selectedArea: '',
                    pageSize: 6,
                    currentPage: 1
                }
            },
            methods: {
                getCityData() {
                    const vm = this;
                    axios.get('js/CityCountyData.json')
                        .then(function (response) {
                            // console.log(response);
                            vm.cityData = response.data;
                        }).catch(function (error) {
                            console.log(error);
                        }).finally(function () {
                            // do nothing
                        });
                },
                getAreaList() {
                    const vm = this;
                    vm.cityData.forEach(function (item) {
                        if (item.CityName == vm.selectedCity) {
                            vm.areaList = item.AreaList;
                        }
                    });
                },
                getHotelData() {
                    const vm = this;
                    axios.get('js/HotelList.json')
                        .then(function (response) {
                            console.log(response.data.Hotels);
                            vm.HotelData = response.data.Hotels
                                .map(function (item, index) {
                                    address = '';
                                    return {
                                        name: cleanText(item.HotelName, "未提供名稱"),
                                        city: cleanText(item.PostalAddress.City, "未提供城市"),
                                        town: cleanText(item.PostalAddress.Town, "未提供行政區"),
                                        street: cleanText(item.PostalAddress.StreetAddress, "未提供詳細地址"),
                                        // img: item.Images.length < 1 ? "未提供圖片1" : cleanText(item.Images[0].URL, "未提供圖片2"),
                                        description: cleanText(item.Description, "未提供簡介").substring(0, 10),
                                        // tel: item.Telephones.length > 0 ? cleanText(item.Telephones[0].Tel, "未提供電話") : "未提供電話",
                                        tel: cleanText(item?.Telephones[0]?.Tel, "未提供電話"),
                                        img: cleanText(item?.Images[0]?.URL, "images/scott-webb-1ddol8rgUH8-unsplash.jpg")
                                    };
                                });
                        }).catch(function (error) {
                            console.log(error);
                        }).finally(function () {
                            //do nothing
                        });
                },
                filterHotelData() {
                    const vm = this;
                    vm.filterHotel = vm.HotelData.filter(function (item) {
                        return item.city == vm.selectedCity && item.town == vm.selectedArea;
                    });
                },
                changePage(page) {
                    const vm = this;
                    // this.currentPage = page;
                    this.currentPage = Math.min(Math.max(page, 1), this.totalPage);
                }
                // previousPage() {
                //     const vm = this;
                //     this.currentPage = Math.max(this.currentPage - 1, 1);
                // },
                // nextPage() {
                //     const vm = this;
                //     this.currentPage = Math.min(this.currentPage + 1, this.totalPage);
                // }
            },
            computed: {
                totalPage() {
                    return Math.ceil(this.filterHotel.length / this.pageSize);
                },
                pageHotelData() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    const end = start + this.pageSize;
                    return this.filterHotel.slice(start, end);
                }
            },
            mounted() {
                const vm = this;
                vm.getCityData();
                vm.getHotelData();
            }
        };

        Vue.createApp(App).mount("#app");
    </script>
</body>

</html>
